<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>Mesh</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--accent:#6ee7b7;--accent2:#818cf8;--text:#e2e8f0;--muted:#64748b;--danger:#f87171; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;flex-direction:column;height:100dvh}
  header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo{font-size:18px;font-weight:700;letter-spacing:-.5px;color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .4s}
  .dot.on{background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .dot.err{background:var(--danger)}
  #status{font-size:13px;color:var(--muted);flex:1}
  #pcnt{font-size:12px;color:var(--accent2);background:#1a1a2e;padding:3px 9px;border-radius:99px;display:none}
  #join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:18px}
  #join h2{font-size:24px;font-weight:700}
  #join p{color:var(--muted);font-size:14px;text-align:center;max-width:340px;line-height:1.65}
  .field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px}
  label{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 14px;font-size:16px;width:100%;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--accent2)}
  .btn{background:var(--accent);color:#0a0a0f;font-weight:700;border:none;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer;width:100%;max-width:340px;transition:opacity .2s}
  .btn:hover{opacity:.88}.btn:disabled{opacity:.35;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);text-align:center;max-width:340px;line-height:1.6}
  #chat{flex:1;display:none;flex-direction:column;overflow:hidden}
  #msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  #msgs::-webkit-scrollbar{width:3px}
  #msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .bubble{max-width:80%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.5;word-break:break-word}
  .bubble.me{background:#1e2a3a;align-self:flex-end;border-bottom-right-radius:3px;border:1px solid #2a3a50}
  .bubble.them{background:#1a1a2e;align-self:flex-start;border-bottom-left-radius:3px;border:1px solid var(--border)}
  .bubble .who{font-size:11px;font-weight:600;margin-bottom:3px}
  .bubble.me .who{color:var(--accent)}.bubble.them .who{color:var(--accent2)}
  .bubble .msgts{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}
  .sys{text-align:center;font-size:12px;color:var(--muted);padding:3px 12px;background:var(--surface);border-radius:99px;align-self:center;border:1px solid var(--border)}
  #bar{display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
  #txt{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:22px;padding:9px 15px;font-size:15px;outline:none;resize:none;max-height:120px;transition:border-color .2s;font-family:inherit}
  #txt:focus{border-color:var(--accent2)}
  #sbtn{width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent);color:#0a0a0f;border:none;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo">◈ Mesh</div>
  <div class="dot" id="dot"></div>
  <span id="status">Ready</span>
  <span id="pcnt"></span>
</header>

<div id="join">
  <h2>Join the Mesh</h2>
  <p>Open this page on any device. Anyone who enters the same channel will appear instantly — no accounts, no servers.</p>
  <div class="field">
    <label>Your name</label>
    <input type="text" id="nameIn" placeholder="Enter your name" maxlength="24" autocomplete="off">
  </div>
  <div class="field">
    <label>Channel</label>
    <input type="text" id="chanIn" placeholder="e.g. cooper-test" maxlength="64" autocomplete="off">
  </div>
  <button class="btn" id="joinBtn" onclick="joinMesh()">Join Mesh</button>
  <p class="hint">Same channel = same mesh. Messages are end-to-end encrypted P2P via WebRTC.</p>
</div>

<div id="chat">
  <div id="msgs"></div>
  <div id="bar">
    <textarea id="txt" placeholder="Message…" rows="1"></textarea>
    <button id="sbtn" onclick="doSend()" title="Send">↑</button>
  </div>
</div>

<script>
var room, actionSend, myName, peerNames = {}, peerCount = 0;

function gel(id) { return document.getElementById(id); }
function msgTime() { return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setStatus(txt, state) {
  gel('status').textContent = txt;
  gel('dot').className = 'dot' + (state ? ' '+state : '');
}
function updateCount() {
  gel('pcnt').textContent = peerCount + (peerCount===1?' peer':' peers');
  gel('pcnt').style.display = peerCount > 0 ? '' : 'none';
}
function addSys(txt) {
  var el = document.createElement('div');
  el.className = 'sys'; el.textContent = txt;
  gel('msgs').appendChild(el); gel('msgs').scrollTop = 99999;
}
function addBubble(who, text, isMe) {
  var el = document.createElement('div');
  el.className = 'bubble ' + (isMe ? 'me' : 'them');
  el.innerHTML = '<div class="who">'+escHtml(who)+'</div><div>'+escHtml(text)+'</div><div class="msgts">'+msgTime()+'</div>';
  gel('msgs').appendChild(el); gel('msgs').scrollTop = 99999;
}

function joinMesh() {
  myName = gel('nameIn').value.trim() || 'Anonymous';
  var channel = gel('chanIn').value.trim() || 'mesh-default';
  localStorage.setItem('mesh-name', myName);
  localStorage.setItem('mesh-chan', channel);
  gel('joinBtn').disabled = true;
  setStatus('Connecting…');

  room = Trystero.joinRoom({ appId: 'mesh-network-v1' }, channel);

  var msgAction = room.makeAction('msg');
  var nameAction = room.makeAction('name');
  actionSend = msgAction[0];
  var onMsg = msgAction[1];
  var sendName = nameAction[0];
  var onName = nameAction[1];

  room.onPeerJoin = function(peerId) {
    peerCount++; updateCount();
    sendName(myName, {target: peerId});
    addSys('Someone joined the mesh');
    setStatus('Connected · ' + channel, 'on');
  };
  room.onPeerLeave = function(peerId) {
    var who = peerNames[peerId] || 'Someone';
    delete peerNames[peerId];
    peerCount = Math.max(0, peerCount - 1); updateCount();
    addSys(who + ' left the mesh');
    if (peerCount === 0) setStatus('Waiting for peers · ' + channel, 'on');
  };
  onName.onMessage = function(name, info) {
    var peerId = info.peerId;
    var isNew = !peerNames[peerId];
    peerNames[peerId] = name;
    if (isNew) {
      var prev = gel('msgs').lastElementChild;
      if (prev && prev.className === 'sys' && prev.textContent === 'Someone joined the mesh') {
        prev.textContent = name + ' joined the mesh';
      } else { addSys(name + ' is here'); }
    }
  };
  onMsg.onMessage = function(text, info) {
    addBubble(peerNames[info.peerId] || info.peerId.slice(0,6), text, false);
  };

  gel('join').style.display = 'none';
  gel('chat').style.display = 'flex';
  setStatus('Waiting for peers · ' + channel, 'on');
  gel('txt').focus();
  addSys('You joined as "' + myName + '" on channel "' + channel + '"');
}

function doSend() {
  var txt = gel('txt').value.trim();
  if (!txt || !actionSend) return;
  actionSend(txt);
  addBubble(myName, txt, true);
  gel('txt').value = ''; gel('txt').style.height = 'auto';
}

// restore saved values
var sn = localStorage.getItem('mesh-name');
var sc = localStorage.getItem('mesh-chan');
if (sn) gel('nameIn').value = sn;
if (sc) gel('chanIn').value = sc;

gel('txt').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
gel('txt').addEventListener('input', function() {
  gel('txt').style.height='auto';
  gel('txt').style.height=Math.min(gel('txt').scrollHeight,120)+'px';
